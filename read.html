<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calculator</title>
    <style>
        body{
            background-color: rgb(41, 40, 40);
            background: linear-gradient(to right, #000000, #444343);

        }
        .calculator{
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            height: 100vh; /* Full viewport height for vertical centering */
            margin: 0; /* Remove default margin */
        }
        table {
            width: 100%; /* Full width of the parent container */
            border-collapse: collapse; /* Remove borders between cells */
            background-color: #887741;
            justify-content: center; 
        }
        th, td {
            border: 1px solid black; /* Add borders to cells */
            padding: 8px; /* Add some padding for better readability */
            text-align: center; /* Left align text in cells */
            size: 50px;
        }
        
        .heading{
            color: #c09f32;
            text-align: center;
            font-size: 50px;

        }
         button {
            text-align: center;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px; /* Increased gap between buttons */
            width: 80px; /* Increased button width */
            height: 70px; /* Increased button height */
            font-size: 24px; /* Increased font size for better readability on larger buttons */
            color: #3a2424;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #ffc400;
        }
        .navbar {
            overflow: hidden;
            background-color: #333;
        }
        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px 0;
            position: relative;
        }
    </style>
 
</head>
<body>
    <div class="navbar">
    <a href="#home">Home</a>
    <a href="#services">Services</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
</div>
    <p class="heading">CALCULATER</p>
        <hr>
    <div class="calculator">

        <div class="buttons">
            <table border="2" style="width: 1000px; height: 500px; font-size: 60px;">
                <tr>
                    <td id="space" style="width: 800px; height: 60px; background-color: rgb(209, 212, 212);" colspan="4" > </td>
                </tr>
             
                <tr>
                    <td><button onclick="add('7')">     7     </button></td>
                    <td><button onclick="add('4')">     4     </button></td>
                    <td><button onclick="add('1')">     1     </button></td>
                    <td><button onclick="add('+')">     +     </button></td>
                </tr>
                <tr>
                    <td><button onclick="add('8')">     8     </button></td>
                    <td><button onclick="add('5')">     5     </button></td>
                    <td><button onclick="add('2')">     2     </button></td>
                    <td><button onclick="add('-')">     -     </button></td>
                </tr>
                <tr>
                    <td><button onclick="add('9')">     9     </button></td>
                    <td><button onclick="add('6')">     6     </button></td>
                    <td><button onclick="add('3')">     3     </button></td>
                    <td><button onclick="add('/')">     /     </button></td>
                   
                </tr>
                <tr>
                    <td><button onclick="cls('')">     C     </button></td>
                    <td><button onclick="add('0')">     0     </button></td>
                    <td><button onclick="add('*')">     *     </button></td>
                     <td><button onclick="equal('=')">     =     </button></td>
                    
                </tr>
            </table>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 NYANTEH COMPANIES</p>
    </footer>

    <script src="calculator.js"></script>
</body>
</html>
